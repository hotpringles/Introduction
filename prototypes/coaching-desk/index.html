<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOGAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'Pretendard', 'ui-monospace', 'monospace'],
          },
          colors: {
            night: { DEFAULT: '#171C22', text: '#E7ECF2', muted: '#C5CED8', bright: '#F4F7F5', line: '#2A3340' },
            desk: '#F2F5F8',
            sheet: '#FFFFFF',
            ink: '#1A212B',
            muted: '#3E4C5C',
            line: { DEFAULT: '#D5DDE6', strong: '#C5CED6' },
            hover: '#E7EDF2',
            code: '#E4E9EE',
            folder: { DEFAULT: '#E2B657', tab: '#C4A15A' },
            cream: '#F8F1DE',
            'on-folder': '#1A160C',
            alert: '#A3432B',
          },
        },
      },
    };
  </script>
  <style>
    html { color-scheme: light; }
    body { margin: 0; font-family: Pretendard, sans-serif; }
    .para { transition: opacity .2s ease, background-color .2s ease; }
    .para[data-on="true"] { background: rgb(248 241 222 / .7); }
    .para[data-dim="true"] { opacity: .35; }
    .role-cell:not(:hover):not(:focus-within) .role-cont { opacity: 0; }
    .role-cont { transition: opacity .15s ease; }
    .group-rule { transition: opacity .2s ease, background-color .2s ease; }
    [data-group]:has(.para[data-on="true"]) .group-rule { background: #C4A15A; }
    [data-group]:not(:has(.para[data-dim="false"])) .group-rule { opacity: .35; }
    .work-grid { display: grid; grid-template-columns: minmax(0, 46rem); justify-content: center; column-gap: 3rem; }
    #source-pane[data-wide="true"] .work-grid { grid-template-columns: 12rem minmax(0, 46rem); }
    #source-pane[data-wide="true"] .work-title { grid-column: 2; grid-row: 1; }
    #source-pane[data-wide="true"] #paras { grid-column: 2; grid-row: 2; }
    #outline { grid-column: 1; grid-row: 2; align-self: start; }
    #source-pane[data-wide="false"] #outline { display: none; }
    #source-pane[data-wide="true"] ~ #outline-compact { display: none; }
    @media (prefers-reduced-motion: reduce) { .para { transition: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 소개 SOGAE 프로토타입: 로그인 → 대시보드 → 구조 선택 → 작업대와 AI 피드백.
    // 디자인은 SOGAE/prototypes/markdown-editor를 따르고, 데이터와 분석 규칙은
    // docs/specs/2026-09-26-nextjs-rebuild-design.md의 Mock 계약을 브라우저 안에서 흉내 낸다.

    const STORAGE_KEY = 'sogae:v1:proto';
    const SCHEMA_VERSION = '1.0.0';

    const WRITING_TYPES = [
      ['cover_letter', '자기소개서'],
      ['essay', '논술'],
      ['report', '보고서'],
      ['university_assignment', '대학 과제'],
      ['free_writing', '자유 글'],
    ];

    const ROLES = {
      claim: '주장', evidence: '근거', example: '예시', explanation: '설명',
      counterargument: '반론', rebuttal: '재반박', conclusion: '결론', background: '배경',
      problem: '문제', solution: '해결', action: '행동', result: '결과',
    };

    const STRUCTURES = {
      intro_body_conclusion: { name: '서론·본론·결론', roles: ['background', 'explanation', 'conclusion'], desc: '가장 익숙한 틀입니다. 문제를 열고, 풀고, 닫는 흐름이 분명해야 합니다.' },
      claim_evidence_example_conclusion: { name: '주장·근거·예시·결론', roles: ['claim', 'evidence', 'example', 'conclusion'], desc: '주장을 먼저 세우고 근거와 예시로 받칩니다. 논술과 칼럼에 잘 맞습니다.' },
      problem_cause_solution_effect: { name: '문제·원인·해결·효과', roles: ['problem', 'explanation', 'solution', 'result'], desc: '무엇이 문제였고 왜 생겼는지, 어떻게 풀었고 무엇이 달라졌는지 차례로 씁니다.' },
      star: { name: 'STAR', roles: ['background', 'problem', 'action', 'result'], desc: '상황, 과제, 행동, 결과. 경험을 증거로 보여 주는 자기소개서의 기본형입니다.' },
      prep: { name: 'PREP', roles: ['claim', 'explanation', 'example', 'conclusion'], desc: '결론을 먼저 말하고 이유와 사례를 댄 뒤 다시 결론으로 닫습니다. 짧은 답변형 문항에 좋습니다.' },
      comparison: { name: '비교·대조', roles: ['background', 'claim', 'counterargument', 'conclusion'], desc: '두 입장을 나란히 놓고 차이를 드러낸 뒤 판단을 내립니다.' },
      scqa: { name: 'SCQA', roles: ['background', 'problem', 'explanation', 'solution'], desc: '상황, 갈등, 질문, 답. 보고서 첫머리에서 읽는 사람의 궁금증을 끌어냅니다.' },
      four_act: { name: '기승전결', roles: ['background', 'action', 'problem', 'result'], desc: '이야기처럼 읽힙니다. 전환점이 분명할수록 결말이 살아납니다.' },
      topic_first_and_last: { name: '양괄식', roles: ['claim', 'evidence', 'conclusion'], desc: '핵심 문장을 처음과 끝에 두어 요점이 흐려지지 않게 합니다.' },
      free_structure: { name: '자유 구조', roles: [], desc: '정해진 단계 없이 씁니다. 분석은 문단 역할의 흐름을 읽어 가장 가까운 구조를 알려 줍니다.' },
    };

    const RECOMMEND = {
      cover_letter: ['star', 'prep', 'four_act'],
      essay: ['claim_evidence_example_conclusion', 'comparison', 'intro_body_conclusion'],
      report: ['problem_cause_solution_effect', 'scqa', 'topic_first_and_last'],
      university_assignment: ['intro_body_conclusion', 'claim_evidence_example_conclusion', 'problem_cause_solution_effect'],
      free_writing: ['free_structure', 'four_act', 'intro_body_conclusion'],
    };

    const SCORE_ITEMS = [
      ['logic', '논리'], ['clarity', '명료성'], ['cohesion', '응집성'],
      ['specificity', '구체성'], ['structure', '구조'], ['toneConsistency', '어조 일관성'],
    ];

    const ROLE_PROMPTS = {
      background: '어떤 상황이었나요? 때와 곳, 맡은 일을 적어 보세요.',
      problem: '무엇이 막혀 있었나요?',
      action: '내가 직접 한 일을 동사로 적어 보세요.',
      result: '무엇이 달라졌나요? 숫자나 반응으로 보여 주세요.',
      claim: '이 글에서 말하고 싶은 한 문장은 무엇인가요?',
      evidence: '그 주장이 맞다고 믿는 이유는 무엇인가요?',
      example: '이유를 보여 줄 장면이나 사례를 하나 골라 보세요.',
      explanation: '앞 문단을 풀어 설명해 보세요.',
      counterargument: '반대편은 무엇이라고 말할까요?',
      rebuttal: '그 반론에 어떻게 답하겠어요?',
      conclusion: '처음의 주장을 한 번 더 묶어 보세요.',
      solution: '어떻게 풀었나요, 혹은 풀 수 있을까요?',
    };

    const ROLE_EXAMPLES = {
      background: '[시기]에 [곳]에서 [맡은 일]을 했다.',
      problem: '[무엇]이 [어떻게] 되지 않아 [누가] 곤란해했다.',
      action: '나는 [기간] 동안 [구체적 행동]을 했다.',
      result: '그 결과 [지표]가 [전]에서 [후]로 바뀌었다.',
      claim: '나는 [주제]에 대해 [입장]이라고 생각한다.',
      evidence: '그 이유는 [근거] 때문이다.',
      example: '예를 들어 [사례]에서 [무엇]이 드러났다.',
      explanation: '이는 [앞 내용]이 [무엇]을 뜻한다는 말이다.',
      counterargument: '물론 [반대 입장]이라는 의견도 있다.',
      rebuttal: '그러나 [반론의 한계] 때문에 [내 입장]이 더 설득력 있다.',
      conclusion: '따라서 [처음의 주장]을 다시 확인하며 [남길 한 문장]으로 맺는다.',
      solution: '[원인]을 줄이기 위해 [방법]을 택했다.',
    };

    // R1: 뭉뚱그린 표현. 긴 표현부터 찾는다.
    const VAGUE = [
      ['많은 노력을 기울여', '[기간] 동안 매일 [시간]씩 들여'],
      ['많은 노력', '[기간] 동안의 [구체적 행동]'],
      ['열심히 하는', '[구체적 행동]을 끝까지 하는'],
      ['열심히', '[기간] 동안 [횟수]번'],
      ['최선을 다해', '[구체적 행동]을 끝까지 해'],
      ['최선을 다했', '[구체적 행동]을 끝까지 해냈'],
      ['많은 것을 배웠', '[배운 것 하나]를 배웠'],
      ['다양한 경험', '[경험 두 가지]'],
      ['큰 도움이 되었', '[무엇]을 [수치]만큼 바꾸었'],
      ['매우 중요', '[이유] 때문에 중요'],
    ];

    const COVER = [
      ['background', '대학교 2학년 때 교내 카페 운영 동아리에서 재고 관리를 맡았습니다. 매주 우유와 원두가 남거나 모자라서 부원들 사이에 불만이 많았습니다.'],
      ['problem', '문제는 발주량을 담당자의 감으로 정한다는 점이었습니다. 저는 이 방식을 바꾸고 싶었지만, 선배들은 지금까지 문제없이 해 왔다며 새 방식에 부정적이었습니다.'],
      ['action', '그래서 저는 많은 노력을 기울여 지난 한 학기 동안의 판매 기록을 엑셀로 정리했고, 요일과 날씨, 시험 기간에 따라 판매량이 어떻게 달라지는지 비교한 표를 만들어 회의 때 선배들에게 보여 주었습니다.'],
      ['explanation', '이 경험을 통해 많은 것을 배웠습니다. 앞으로도 열심히 하는 사람이 되고 싶습니다.'],
    ];

    const ESSAY = [
      ['claim', '원격 수업은 대면 수업을 완전히 대체할 수 없다. 원격 수업은 시간과 장소의 제약을 줄였지만, 배움은 지식을 전달받는 데서 끝나지 않기 때문이다.'],
      ['evidence', '학습은 질문과 반응이 오가는 과정에서 깊어진다. 화면 너머의 학생은 질문할 때를 놓치기 쉽고, 교사는 학생의 표정을 읽기 어렵다.'],
      ['example', '원격 수업을 경험한 학생들은 편리함을 인정하면서도 동료와 나누던 토론이 줄었다는 점을 가장 아쉬워한다.'],
      ['conclusion', '따라서 원격 수업은 대면 수업을 보완하는 도구로 쓰일 때 가장 가치가 있다.'],
    ];

    const VIEWS = [['desk', '대시보드'], ['new', '새 글'], ['doc', '작업대']];
    const NAV_ICONS = {
      desk: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
      new: '<path d="M12 5v14"/><path d="M5 12h14"/>',
      doc: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    };

    let state = null;
    const ui = {
      docId: '',
      outlineOpen: false,
      openIssue: -1,
      tab: 'issues',
      activePara: '',
      analyzing: false,
      analyzeError: '',
      saveTimer: 0,
      saveStatus: 'saved',
      savedAt: '',
      panelW: '26rem',
      loginTouched: false,
    };
    const app = document.getElementById('app');

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function daysAgo(days, hour) {
      const date = new Date();
      date.setDate(date.getDate() - days);
      date.setHours(hour, 12, 0, 0);
      return date.toISOString();
    }

    function escapeHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function typeName(id) {
      const item = WRITING_TYPES.find(([key]) => key === id);
      return item ? item[1] : '';
    }

    function flowText(structureId) {
      const roles = STRUCTURES[structureId].roles;
      return roles.length ? roles.map((role) => ROLES[role]).join(' → ') : '정해진 단계 없음';
    }

    function countChars(text) { return Array.from(String(text || '').replace(/\n/g, '')).length; }

    function docText(doc) { return doc.paragraphs.map((p) => p.text).join('\n'); }

    function docTitle(doc) { return doc.title.trim() || '제목 없음'; }

    function excerpt(doc, size) {
      const first = doc.paragraphs.find((p) => p.text.trim());
      const text = first ? first.text.trim() : '';
      return text.length > size ? text.slice(0, size) + '…' : text;
    }

    function dayKey(date) {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
    }

    function clock(date) {
      return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(date);
    }

    function formatWhen(iso) {
      const date = new Date(iso);
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      const key = dayKey(date);
      if (key === dayKey(today)) return `오늘 ${clock(date)}`;
      if (key === dayKey(yesterday)) return `어제 ${clock(date)}`;
      const monthDay = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric' }).format(date);
      return `${monthDay} ${clock(date)}`;
    }

    function formatToday() {
      return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
    }

    /* ---------- 저장소 ---------- */

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      } catch (error) {
        return false;
      }
    }

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && Array.isArray(saved.docs)) {
          state = saved;
          state.analyses = state.analyses || {};
          state.versions = state.versions || {};
          state.prefs = Object.assign({ panelOpen: true, deskType: 'cover_letter' }, state.prefs);
          return;
        }
      } catch (error) { /* 깨진 값은 비우고 처음부터 시작한다 */ }
      state = { session: null, seeded: false, docs: [], analyses: {}, versions: {}, prefs: { panelOpen: true, deskType: 'cover_letter' }, lastDocId: '' };
      persist();
    }

    function session() {
      const current = state.session;
      if (!current || new Date(current.expiresAt) < new Date()) return null;
      return current;
    }

    function makeDoc(writingType, structure, title, rows, createdAt, updatedAt) {
      return {
        id: uid(),
        title,
        writingType,
        structure,
        paragraphs: rows.map(([role, text]) => ({ id: uid(), role, text })),
        createdAt,
        updatedAt,
      };
    }

    function seedDemoScenario() {
      if (state.seeded) return;
      const cover = makeDoc('cover_letter', 'star', '데이터로 설득했던 순간', COVER, daysAgo(6, 20), daysAgo(1, 21));
      const essay = makeDoc('essay', 'claim_evidence_example_conclusion', '원격 수업은 대면 수업을 대체할 수 있는가', ESSAY, daysAgo(3, 15), daysAgo(3, 16));
      state.docs = [cover, essay];
      const request = buildAnalyzeRequest(cover);
      const record = analyze(request);
      state.analyses[cover.id] = [{
        id: uid(), documentId: cover.id, versionId: null, snapshot: request.paragraphs, schemaVersion: SCHEMA_VERSION,
        model: 'mock', promptVersion: null, result: record.result, hints: record.hints, createdAt: daysAgo(1, 21),
      }];
      state.lastDocId = cover.id;
      state.seeded = true;
    }

    function docById(id) { return state.docs.find((doc) => doc.id === id) || null; }

    function sortedDocs() { return state.docs.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)); }

    function analysesOf(id) { return state.analyses[id] || []; }

    function average(scores) {
      const values = SCORE_ITEMS.map(([key]) => scores[key]);
      return Math.round((values.reduce((sum, value) => sum + value, 0) / values.length) * 10) / 10;
    }

    function latestScore(id) {
      const latest = analysesOf(id)[0];
      return latest ? average(latest.result.scores) : null;
    }

    function lowestItem(scores) {
      return SCORE_ITEMS.reduce((low, item) => (scores[item[0]] < scores[low[0]] ? item : low), SCORE_ITEMS[0]);
    }

    function createVersion(doc, reason) {
      const list = state.versions[doc.id] || (state.versions[doc.id] = []);
      const body = JSON.stringify({ title: doc.title, paragraphs: doc.paragraphs });
      if (list[0] && list[0].body === body) return false;
      list.unshift({ id: uid(), documentId: doc.id, reason, body, createdAt: new Date().toISOString() });
      state.versions[doc.id] = list.slice(0, 40);
      return true;
    }

    /* ---------- 분석 (MockAnalyzer) ---------- */

    function buildAnalyzeRequest(doc) {
      const paragraphs = doc.paragraphs
        .filter((p) => p.text.trim())
        .slice(0, 50)
        .map((p, index) => ({ paragraphId: p.id, index, role: p.role || null, text: p.text.trim().slice(0, 2000) }));
      return { writingType: doc.writingType, selectedStructure: doc.structure, paragraphs };
    }

    function sentences(text) {
      return text.split(/(?<=[.!?])\s+|\n+/).map((item) => item.trim()).filter(Boolean);
    }

    function lcs(a, b) {
      const table = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
      for (let i = 1; i <= a.length; i += 1) {
        for (let j = 1; j <= b.length; j += 1) {
          table[i][j] = a[i - 1] === b[j - 1] ? table[i - 1][j - 1] + 1 : Math.max(table[i - 1][j], table[i][j - 1]);
        }
      }
      return table[a.length][b.length];
    }

    function clip(text, size) { return text.length > size ? text.slice(0, size - 1) + '…' : text; }

    function analyze(request) {
      const { paragraphs, selectedStructure } = request;
      const penalty = { logic: 0, clarity: 0, cohesion: 0, specificity: 0, structure: 0, toneConsistency: 0 };
      const found = [];
      const add = (weight, label, role, issue) => found.push({ weight, hint: { label, role }, issue });
      const at = (p) => ({ paragraphId: p.paragraphId, paragraphIndexAtAnalysis: p.index });
      const formal = (line) => /니다[.!?]?$/.test(line);

      // R1 뭉뚱그린 표현
      paragraphs.forEach((p) => {
        const lines = sentences(p.text);
        const hit = lines.map((line) => ({ line, pair: VAGUE.find(([word]) => line.includes(word)) })).filter((item) => item.pair);
        if (!hit.length) return;
        penalty.specificity += 2;
        const { line, pair } = hit[0];
        const word = pair[0].replace(/[을를]$/, '');
        add(2, '구체성', null, Object.assign(at(p), {
          excerpt: clip(line, 400),
          reason: clip(`'${word}' 같은 표현은 무엇을 얼마나 했는지 보여 주지 않습니다.${hit.length > 1 ? ` 이 문단에 비슷한 표현이 ${hit.length}번 있습니다.` : ''}`, 300),
          suggestion: '행동, 기간, 숫자 가운데 하나를 넣어 읽는 사람이 장면을 떠올리게 해 보세요.',
          question: '이 표현을 쓴 순간, 실제로 무엇을 했고 무엇이 달라졌나요?',
          revisedExample: clip(line.replace(pair[0], pair[1]), 400),
        }));
      });

      // R2 80자를 넘는 문장
      paragraphs.forEach((p) => {
        const long = sentences(p.text).filter((line) => countChars(line) > 80);
        if (!long.length) return;
        penalty.clarity += Math.min(long.length, 3);
        const line = long[0];
        const split = /(했|었|았|였)고,\s*/;
        const revised = split.test(line)
          ? line.replace(split, formal(line) ? '$1습니다. ' : '$1다. ')
          : '[첫 문장: 가장 먼저 전할 한 가지]. [둘째 문장: 덧붙이는 내용].';
        add(1, '명료성', null, Object.assign(at(p), {
          excerpt: clip(line, 400),
          reason: `한 문장이 ${countChars(line)}자입니다. 80자를 넘으면 읽는 사람이 주어와 서술어를 놓치기 쉽습니다.`,
          suggestion: '‘~고’, ‘~며’, ‘~는데’로 이어지는 자리에서 두 문장으로 나눠 보세요.',
          question: '이 문장에서 가장 먼저 전하고 싶은 한 가지는 무엇인가요?',
          revisedExample: clip(revised, 400),
        }));
      });

      // R3 선택 구조의 단계 누락
      const stages = STRUCTURES[selectedStructure].roles;
      const present = new Set(paragraphs.map((p) => p.role).filter(Boolean));
      const missing = stages.filter((role) => !present.has(role));
      missing.forEach((role) => {
        penalty.structure += 2;
        add(2, '구조', role, {
          paragraphId: null,
          paragraphIndexAtAnalysis: null,
          excerpt: `${STRUCTURES[selectedStructure].name} 구조의 '${ROLES[role]}' 단계`,
          reason: `선택한 ${STRUCTURES[selectedStructure].name} 구조에는 '${ROLES[role]}' 역할을 맡은 문단이 있어야 하는데 아직 없습니다.`,
          suggestion: `'${ROLES[role]}' 문단을 새로 쓰거나, 이미 쓴 문단 가운데 그 역할을 하는 문단의 역할을 다시 지정해 보세요.`,
          question: ROLE_PROMPTS[role],
          revisedExample: ROLE_EXAMPLES[role],
        });
      });

      // 응집성: 역할 없는 문단과 단계 순서가 뒤집힌 곳
      const unassigned = paragraphs.filter((p) => !p.role).length;
      const order = paragraphs.map((p) => stages.indexOf(p.role)).filter((index) => index >= 0);
      const inversions = order.filter((value, index) => index > 0 && value < order[index - 1]).length;
      penalty.cohesion += Math.min(unassigned, 3) + Math.min(inversions, 3);

      // R4 결론 누락
      const last = paragraphs[paragraphs.length - 1];
      if (paragraphs.length >= 2 && !['conclusion', 'result'].includes(last.role)) {
        penalty.logic += 2;
        const lines = sentences(last.text);
        add(2, '논리', null, Object.assign(at(last), {
          excerpt: clip(lines[lines.length - 1] || last.text, 400),
          reason: '마지막 문단이 결론이나 결과로 끝나지 않아, 글이 무엇을 보여 주려 했는지 흐려집니다.',
          suggestion: '처음에 던진 주장이나 경험의 의미를 한 문장으로 다시 묶고, 그 뒤에 무엇이 달라졌는지 덧붙여 보세요.',
          question: '읽는 사람이 이 글을 덮고 기억했으면 하는 한 문장은 무엇인가요?',
          revisedExample: formal(last.text.trim())
            ? '[이 경험이 보여 준 것]을 통해 [무엇]이 [어떻게] 달라졌습니다.'
            : ROLE_EXAMPLES.conclusion,
        }));
      }

      // 어조: 합니다체와 한다체가 섞였는지
      const lines = paragraphs.flatMap((p) => sentences(p.text).map((line) => ({ p, line })));
      const formalLines = lines.filter(({ line }) => formal(line));
      const plainLines = lines.filter(({ line }) => /[^니]다[.!?]?$/.test(line));
      if (formalLines.length && plainLines.length) {
        penalty.toneConsistency += 2;
        const minority = formalLines.length < plainLines.length ? formalLines[0] : plainLines[0];
        const toPlain = formalLines.length < plainLines.length;
        const revised = toPlain
          ? minority.line.replace(/입니다/, '이다').replace(/습니다/, '다')
          : minority.line.replace(/했다/, '했습니다').replace(/었다/, '었습니다').replace(/이다/, '입니다');
        add(2, '어조 일관성', null, Object.assign(at(minority.p), {
          excerpt: clip(minority.line, 400),
          reason: '합니다체와 한다체가 섞여 있어 읽는 사람과의 거리가 문단마다 달라집니다.',
          suggestion: '글 전체를 한 가지 어미로 맞춰 보세요.',
          question: '이 글을 읽을 사람에게 어떤 거리에서 말하고 싶나요?',
          revisedExample: clip(revised, 400),
        }));
      }

      // R5 가장 가까운 구조
      const sequence = paragraphs.map((p) => p.role).filter(Boolean);
      let detected = 'free_structure';
      let best = 1;
      Object.keys(STRUCTURES).forEach((key) => {
        if (key === 'free_structure') return;
        const value = lcs(sequence, STRUCTURES[key].roles);
        if (value > best || (value === best && value > 1 && key === selectedStructure)) {
          best = value;
          detected = key;
        }
      });

      const scores = {};
      Object.keys(penalty).forEach((key) => { scores[key] = Math.max(0, Math.min(10, 10 - penalty[key])); });
      const picked = found.map((item, order) => ({ item, order }))
        .sort((a, b) => b.item.weight - a.item.weight || a.order - b.order)
        .slice(0, 6)
        .map(({ item }) => item);

      let alignment = 'match';
      if (selectedStructure === 'free_structure') alignment = detected === 'free_structure' ? 'match' : 'partial';
      else if (missing.length || detected !== selectedStructure) alignment = missing.length >= stages.length / 2 ? 'mismatch' : 'partial';

      const selectedName = STRUCTURES[selectedStructure].name;
      const detectedName = STRUCTURES[detected].name;
      const missingText = missing.map((role) => `'${ROLES[role]}'`).join(', ');
      const explanation = alignment === 'match'
        ? `문단 역할의 흐름이 선택한 ${selectedName} 구조와 맞습니다.`
        : detected === selectedStructure
          ? `문단 역할의 흐름은 ${selectedName}에 가깝지만 ${missingText} 단계가 비어 있습니다.`
          : `지금 글은 ${detectedName} 흐름에 더 가깝게 읽힙니다.${missing.length ? ` ${missingText} 단계를 채우면 선택한 ${selectedName} 구조와 맞춰집니다.` : ''}`;

      const low = lowestItem(scores);
      const summary = [
        `${paragraphs.length}개 문단을 ${selectedName} 구조로 읽었습니다.`,
        `가장 낮은 항목은 ${low[1]}(${scores[low[0]]}점)입니다.`,
        missing.length ? `선택한 구조에서 ${missingText} 단계가 비어 있습니다.` : '선택한 구조의 단계는 모두 갖췄습니다.',
        '문장을 대신 고치지 않고, 직접 고칠 수 있도록 질문과 예시를 남겼습니다.',
      ].join(' ');

      return {
        result: {
          summary,
          scores,
          detectedStructure: {
            logicalStructure: detected,
            paragraphRoles: paragraphs.filter((p) => p.role).map((p) => ({ paragraphId: p.paragraphId, paragraphIndexAtAnalysis: p.index, role: p.role })),
          },
          issues: picked.map((item) => item.issue),
          structureComparison: { selectedStructure, detectedStructure: detected, alignment, explanation },
        },
        // 화면 표시용 보조 정보. 계약(result)에는 넣지 않는다.
        hints: picked.map((item) => item.hint),
      };
    }

        <path class="fill-folder-tab" d="M0 6a6 6 0 0 1 6-6h34.5a6 6 0 0 1 4.7 2.3L51 9.6h63a6 6 0 0 1 6 6V94a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6Z"/>
        <rect class="fill-desk motion-safe:transition-transform motion-safe:duration-200 ${lift}" x="4" y="15" width="112" height="30" rx="2"/>
        <rect class="fill-folder" x="0" y="23" width="120" height="77" rx="6"/>
      </svg>`;
    }

    const focusRing = 'focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink';

    const primary = `rounded-md bg-folder px-3 py-1.5 text-sm font-medium text-on-folder motion-safe:transition hover:brightness-95 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50 ${focusRing}`;

      const href = id === 'doc' ? `#/doc/${state.lastDocId}` : `#/${id}`;
      return `<a href="${href}" class="relative flex shrink-0 items-center gap-2.5 rounded-md px-3 py-2 text-left text-sm no-underline motion-safe:transition-colors md:w-full md:before:absolute md:before:inset-y-2 md:before:-left-3 md:before:w-0.5 md:before:rounded-full ${tone} ${focusRingDark}" aria-current="${on ? 'page' : 'false'}">
        <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICONS[id]}</svg>${label}</a>`;
    }

    function shell(current, main, mainClass) {
      const views = VIEWS.filter(([id]) => id !== 'doc' || docById(state.lastDocId));

          <p class="mr-2 flex shrink-0 items-center gap-2 px-3 text-sm font-semibold tracking-[0.14em] text-night-bright md:mb-6 md:mr-0">${folderIcon('h-4 w-5', false)}SOGAE</p>
          ${views.map(([id, label]) => navButton(id, label, current)).join('')}

            <p class="hidden max-w-full truncate font-mono text-xs text-night-muted md:block">${escapeHtml(who ? who.email : '')}</p>
            <button type="button" data-signout class="text-sm text-night-muted underline-offset-4 hover:text-night-bright hover:underline ${focusRingDark}">로그아웃</button>

    function blanks(text) {
      return escapeHtml(text).replace(/\[([^\]]+)\]/g, '<span class="rounded bg-folder/30 px-1 font-medium text-on-folder">$1</span>');

    /* ---------- 로그인 ---------- */

    function login() {
      const field = (id, label, type, auto, placeholder) => `
        <label class="mt-6 block text-sm text-muted" for="${id}">${label}</label>
        <input id="${id}" name="${id}" type="${type}" autocomplete="${auto}" placeholder="${placeholder}" aria-describedby="${id}-error" class="mt-2 w-full rounded-md border border-line-strong bg-sheet px-3 py-2 text-sm text-ink placeholder:text-muted/50 aria-[invalid=true]:border-alert ${focusRing}">
        <p id="${id}-error" class="mt-1.5 min-h-[1rem] text-xs text-alert"></p>`;
      return `<div class="grid min-h-[100dvh] bg-night md:grid-cols-[minmax(0,1fr)_30rem]">
        <section class="flex flex-col justify-between gap-12 px-6 py-8 text-night-text md:px-14 md:py-12" aria-label="소개">
          <p class="flex items-center gap-2 text-sm font-semibold tracking-[0.14em] text-night-bright">${folderIcon('h-4 w-5', false)}SOGAE</p>
          <div class="max-w-3xl">
            <h1 class="m-0 break-keep text-4xl font-semibold leading-[1.15] tracking-tight text-night-bright md:text-6xl">다시 만나서<br>반갑습니다</h1>
            <div class="mt-10 max-w-2xl gap-10 text-[0.95rem] leading-7 text-night-muted md:columns-2">
              <p class="m-0 break-keep">소개는 글을 대신 써 주지 않습니다. 내가 쓴 문단을 읽고 논리가 어디서 끊기는지, 어떤 습관이 반복되는지 짚어 줍니다.</p>
              <p class="m-0 mt-4 break-keep md:mt-0">진단, 설명, 질문, 개선 제안의 순서로 돕습니다. 고치는 손은 끝까지 쓰는 사람의 것이고, 문체도 그대로 남습니다.</p>
            </div>
          </div>
          <blockquote class="m-0 max-w-md break-keep border-l-2 border-folder pl-4 text-base leading-7 text-night-text">좋은 문장은 빌려 온 문장이 아니라, 다시 고쳐 쓴 내 문장이다.</blockquote>
        </section>
        <section class="flex items-center bg-sheet px-6 py-12 text-ink md:px-12" aria-label="로그인">
          <form id="login-form" novalidate class="w-full">
            <h2 class="m-0 text-2xl font-semibold tracking-tight">로그인</h2>
            <p class="mt-2 break-keep text-sm leading-6 text-muted">프로토타입입니다. 이메일 형식과 8자 이상의 비밀번호면 들어갈 수 있습니다.</p>
            ${field('email', '이메일', 'email', 'email', 'you@example.com')}
            ${field('password', '비밀번호', 'password', 'current-password', '8자 이상')}
            <button type="submit" class="mt-4 w-full rounded-md bg-folder px-4 py-2.5 text-sm font-semibold text-on-folder motion-safe:transition hover:brightness-95 active:scale-[0.98] ${focusRing}">로그인</button>
            <button type="button" disabled class="mt-3 w-full cursor-not-allowed rounded-md border border-line-strong px-4 py-2.5 text-sm text-muted opacity-60">Google로 계속하기 · 준비 중</button>
          </form>
        </section>
      </div>`;
    }

    function checkLogin(show) {
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const errors = {
        email: !email.value.trim() ? '이메일을 적어 주세요.' : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()) ? '' : '이메일 형식이 아닙니다. 예: you@example.com',
        password: !password.value ? '비밀번호를 적어 주세요.' : password.value.length >= 8 ? '' : `비밀번호는 8자 이상이어야 합니다. 지금 ${password.value.length}자입니다.`,
      };
      if (show) {
        [['email', email], ['password', password]].forEach(([key, input]) => {
          input.setAttribute('aria-invalid', errors[key] ? 'true' : 'false');
          document.getElementById(`${key}-error`).textContent = errors[key];
        });
      }
      return !errors.email && !errors.password;
    }

    function signIn() {
      ui.loginTouched = true;
      if (!checkLogin(true)) {
        const firstBad = document.querySelector('[aria-invalid="true"]');
        if (firstBad) firstBad.focus();
        return;
      }
      const email = document.getElementById('email').value.trim();
      const now = new Date();
      state.session = { userId: email, email, issuedAt: now.toISOString(), expiresAt: new Date(now.getTime() + 7 * 864e5).toISOString() };
      seedDemoScenario();
      persist();
      const next = new URLSearchParams(location.hash.split('?')[1] || '').get('next');
      location.hash = next && next.startsWith('/') && !next.startsWith('/login') ? next : '/desk';
    }

    function docRow(doc) {
      const score = latestScore(doc.id);
      return `<div class="-mx-3 flex items-start justify-between gap-4 rounded-md px-3 py-3 motion-safe:transition-colors hover:bg-desk">

    function scoreBars(scores, compact, decimals) {
      const low = lowestItem(scores)[0];
      return `<ul class="m-0 flex list-none flex-col ${compact ? 'gap-2' : 'gap-2.5'} p-0">${SCORE_ITEMS.map(([key, label]) => {
        const isLow = key === low;

    function desk() {
      const docs = sortedDocs();
      const lead = docs[0];
      const todayKey = dayKey(new Date());

      const analysedToday = Object.values(state.analyses).flat().filter((a) => dayKey(new Date(a.createdAt)) === todayKey).length;
      const todayLine = touched.length || analysedToday
        ? `오늘 고친 글 ${touched.length}편, 분석 ${analysedToday}번`
        : '오늘은 아직 고친 글이 없습니다.';

      const leadHtml = lead
        ? `<div class="mt-8 flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
          <div class="min-w-0">
            <p class="text-xs font-medium text-muted">이어서 쓸 글 · ${typeName(lead.writingType)} · ${STRUCTURES[lead.structure].name}</p>
