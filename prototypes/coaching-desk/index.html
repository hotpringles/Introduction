          <div class="flex shrink-0 flex-wrap items-center gap-4">
            <a href="#/doc/${lead.id}" class="${primary} no-underline">이어 쓰기</a>
            <a href="#/new" class="text-sm text-muted underline-offset-4 hover:underline ${focusRing}">새 글 쓰기</a>
          </div>
        </div>`
        : `<div class="mt-8">
          <h1 class="text-3xl font-semibold tracking-tight">아직 글이 없습니다</h1>
          <p class="mt-3 max-w-xl break-keep text-base leading-7 text-muted">글 유형과 구조를 고르면 작업대에서 문단마다 역할을 정해 두고 쓸 수 있습니다.</p>
          <a href="#/new" class="${primary} mt-6 inline-block no-underline">새 글 쓰기</a>
        </div>`;

      const all = docs.map((doc) => ({ doc, analysis: analysesOf(doc.id)[0] })).filter((item) => item.analysis)
        .sort((a, b) => new Date(b.analysis.createdAt) - new Date(a.analysis.createdAt));
      // 글마다 가장 최근 분석 하나를 골라 항목별로 평균을 낸다.
      const overall = all.length
        ? Object.fromEntries(SCORE_ITEMS.map(([key]) => [key, Math.round((all.reduce((sum, item) => sum + item.analysis.result.scores[key], 0) / all.length) * 10) / 10]))
        : null;
      const scoreHtml = overall
        ? (() => {
          const low = lowestItem(overall);
          const high = SCORE_ITEMS.reduce((top, item) => (overall[item[0]] > overall[top[0]] ? item : top), SCORE_ITEMS[0]);
          const weakest = all.reduce((min, item) => (average(item.analysis.result.scores) < average(min.analysis.result.scores) ? item : min), all[0]);
          const lastAt = all[0].analysis.createdAt;
          return `<div class="mt-4 flex flex-wrap items-end gap-x-5 gap-y-2">
              <p class="m-0 flex items-baseline gap-2"><span class="text-[5rem] font-semibold leading-none tracking-tight tabular-nums">${average(overall).toFixed(1)}</span><span class="font-mono text-sm text-muted">/ 10</span></p>
              <div class="min-w-0 pb-1">
                <p class="m-0 text-sm text-muted">분석한 글 ${all.length}편의 평균</p>
                <p class="m-0 mt-1 font-mono text-xs text-muted">마지막 분석 ${formatWhen(lastAt)}</p>
              </div>
            </div>
            <p class="mt-5 break-keep text-sm leading-6 text-ink">글마다 가장 최근 분석을 모아 본 점수입니다. 가장 낮은 항목은 ${low[1]}(평균 ${overall[low[0]].toFixed(1)}점), 가장 높은 항목은 ${high[1]}(평균 ${overall[high[0]].toFixed(1)}점)입니다.</p>
            <div class="mt-5">${scoreBars(overall, true, true)}</div>
            <div class="mt-5 min-w-0">
              <p class="m-0 text-xs text-muted">가장 먼저 손볼 글</p>
              <a href="#/doc/${weakest.doc.id}?issue=0" class="mt-1 flex min-w-0 items-baseline gap-2 text-sm font-medium text-ink no-underline ${focusRing}"><span class="truncate underline decoration-folder-tab decoration-2 underline-offset-4">${escapeHtml(docTitle(weakest.doc))}</span><span class="shrink-0 font-mono text-xs text-muted">${average(weakest.analysis.result.scores).toFixed(1)}점 · 지적 ${weakest.analysis.result.issues.length}개</span></a>
            </div>`;
        })()
        : '<p class="mt-4 break-keep text-sm leading-6 text-muted">아직 분석한 글이 없습니다. 작업대에서 분석하면 내 글 전체의 점수가 여기에 모입니다.</p>';

      // 패턴은 점수가 아니라 여러 글에서 되풀이된 지적 종류를 센다.
      const patternHtml = docs.length < 3
        ? `<p class="mt-3 break-keep text-sm leading-6 text-muted">준비 중입니다. 글이 3편 쌓이면 여러 글에서 되풀이되는 습관을 보여 드립니다. 지금 ${docs.length}편입니다.</p>`
        : (() => {
          const counts = {};
          all.forEach(({ analysis }) => (analysis.hints || []).forEach((hint) => {
            if (hint.label) counts[hint.label] = (counts[hint.label] || 0) + 1;
          }));
          const top = Object.entries(counts).sort((x, y) => y[1] - x[1])[0];
          if (!top) return '<p class="mt-3 text-sm leading-6 text-muted">아직 여러 글에서 되풀이된 지적이 없습니다.</p>';
          return `<p class="mt-3 break-keep text-sm leading-6 text-ink">분석한 ${all.length}편에서 '${top[0]}' 지적이 ${top[1]}번 나왔습니다. 가장 자주 되풀이되는 습관입니다.</p>`;
        })();

      const typeDocs = docs.filter((doc) => doc.writingType === state.prefs.deskType);
      // 1280px 이상에서는 좌우로 나눈다. 왼쪽은 점수, 오른쪽은 글 유형과 글 목록이며 목록만 따로 스크롤된다.
      // 화면이 낮으면 페이지가 점수 칸 높이만큼 늘고, 목록은 그 높이에 맞춰진다.
      return `<section class="mx-auto flex max-w-6xl flex-col px-5 py-10 md:px-14 md:py-12 xl:min-h-full" aria-label="대시보드">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <p class="text-sm font-medium text-ink">${formatToday()}</p>
          <p class="font-mono text-xs text-muted">${todayLine}</p>
        </div>
        ${leadHtml}
        <div class="mt-14 flex flex-col gap-14 xl:mt-12 xl:grid xl:flex-1 xl:grid-cols-[minmax(0,21rem)_1px_minmax(0,1fr)] xl:gap-12">
          <div class="flex min-w-0 flex-col">
            <h2 class="text-xs font-medium text-muted">내 글 점수</h2>
            ${scoreHtml}
            <div class="mt-12 xl:mt-auto xl:pt-10">
              <h2 class="text-xs font-medium text-muted">글쓰기 패턴</h2>
              ${patternHtml}
            </div>
          </div>
          <div class="hidden bg-line xl:block" aria-hidden="true"></div>
          <div class="flex min-w-0 flex-col xl:min-h-0">
            <h2 class="text-xs font-medium text-muted">글 유형 · ${WRITING_TYPES.length}개</h2>
            <div class="-mx-2">${folderGrid()}</div>
            <div class="mt-8 flex items-center justify-between gap-4 border-b border-line pb-2">
              <h2 class="flex min-w-0 items-center gap-2 text-xs font-medium text-muted">${folderIcon('h-3.5 w-4 shrink-0', false)}<span class="truncate">${typeName(state.prefs.deskType)} · ${typeDocs.length}편</span></h2>
              <a href="#/new?type=${state.prefs.deskType}" class="shrink-0 rounded-md px-2 py-1 text-sm text-ink no-underline motion-safe:transition-colors hover:bg-desk active:scale-[0.98] ${focusRing}">+ 새 글</a>
            </div>
            <div class="relative xl:min-h-[15rem] xl:flex-1">
              <div id="desk-list" class="-mx-3 px-3 pt-2 xl:absolute xl:inset-0 xl:overflow-y-auto xl:pb-12 xl:[scrollbar-width:thin]">${typeDocs.map((doc) => docRow(doc)).join('') || '<p class="py-6 text-sm text-muted">이 유형에는 아직 글이 없습니다.</p>'}</div>
              <div class="pointer-events-none absolute inset-x-0 bottom-0 hidden h-12 bg-gradient-to-t from-sheet to-transparent xl:block" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>`;
    }

    /* ---------- 구조 선택 ---------- */

    function stageChips(structureId, tone) {
      const roles = STRUCTURES[structureId].roles;
      if (!roles.length) return `<p class="m-0 text-xs text-muted">정해진 단계 없음</p>`;
      return `<ol class="m-0 flex list-none flex-wrap items-center gap-1 p-0">${roles.map((role, index) => `<li class="flex items-center gap-1">${index ? '<span class="text-xs text-muted" aria-hidden="true">→</span>' : ''}<span class="rounded px-1.5 py-0.5 text-xs ${tone}">${ROLES[role]}</span></li>`).join('')}</ol>`;
    }

    function structurePage(query) {
      const typeFromQuery = query.get('type');
      if (typeFromQuery && RECOMMEND[typeFromQuery] && !ui.pickTouched) {
        state.pick = { type: typeFromQuery, structure: RECOMMEND[typeFromQuery][0] };
      }
      if (!state.pick || !RECOMMEND[state.pick.type]) state.pick = { type: state.prefs.deskType, structure: RECOMMEND[state.prefs.deskType][0] };
      const { type, structure } = state.pick;
      const recommended = RECOMMEND[type];
      const others = Object.keys(STRUCTURES).filter((key) => !recommended.includes(key));

      const types = WRITING_TYPES.map(([id, name]) => {
        const on = id === type;
        return `<button type="button" data-pick-type="${id}" class="group flex w-full shrink-0 items-center gap-2.5 rounded-md px-3 py-2 text-left text-sm motion-safe:transition-colors ${on ? 'bg-desk font-semibold text-ink' : 'text-muted hover:bg-desk/60'} ${focusRing}" aria-pressed="${on ? 'true' : 'false'}">${folderIcon('h-3.5 w-4 shrink-0', false)}${name}</button>`;
      }).join('');

      const cards = recommended.map((key, index) => {
        const on = key === structure;
        const tone = on
          ? '-translate-y-1 ring-1 ring-folder-tab shadow-[0_14px_36px_rgb(196_161_90/0.22),0_3px_8px_rgb(196_161_90/0.14)]'
          : 'ring-1 ring-transparent hover:ring-line-strong';
        return `<button type="button" data-pick="${key}" class="flex h-full flex-col rounded-lg bg-desk p-5 text-left motion-safe:transition motion-safe:duration-200 ${tone} ${focusRing}" aria-pressed="${on ? 'true' : 'false'}">
          <span class="font-mono text-xs ${on ? 'text-folder-tab' : 'text-muted'}">추천 ${index + 1}</span>
          <span class="mt-2 block text-lg font-semibold tracking-tight text-ink">${STRUCTURES[key].name}</span>
          <span class="mt-4 block">${stageChips(key, on ? 'bg-folder/25 text-on-folder' : 'bg-sheet text-ink ring-1 ring-line')}</span>
          <span class="mt-auto block break-keep pt-6 text-sm leading-6 text-muted">${STRUCTURES[key].desc}</span>
        </button>`;
      }).join('');

      const rows = others.map((key) => {
        const on = key === structure;
        return `<button type="button" data-pick="${key}" class="flex w-full items-center justify-between gap-4 border-l-2 px-4 py-3 text-left motion-safe:transition-colors ${on ? 'border-folder-tab bg-cream/70' : 'border-transparent hover:bg-desk'} ${focusRing}" aria-pressed="${on ? 'true' : 'false'}">
          <span class="min-w-0"><span class="block text-sm font-medium text-ink">${STRUCTURES[key].name}</span><span class="mt-0.5 block break-keep text-sm leading-6 text-muted">${STRUCTURES[key].desc}</span></span>
          <span class="hidden shrink-0 font-mono text-xs text-muted md:block">${flowText(key)}</span>
        </button>`;
      }).join('');

      // 선택 요약은 본문 흐름 안에 둔다. 넓은 화면에서는 글 유형 아래에 붙어 따라오고, 좁은 화면에서는 구조 목록 뒤에 온다.
      return `<section class="mx-auto w-full max-w-6xl px-5 py-10 md:px-14 md:py-14" aria-label="구조 선택">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <p class="text-sm font-medium text-ink">${formatToday()}</p>
            <p class="font-mono text-xs text-muted">글 유형 → 구조 → 작성</p>
          </div>
          <h1 class="mt-10 break-keep text-3xl font-semibold leading-tight tracking-tight md:text-4xl">어떤 구조로 쓸까요?</h1>
          <p class="mt-3 max-w-2xl break-keep text-base leading-7 text-muted">구조를 고르면 문단마다 맡을 역할이 미리 놓입니다. 쓰는 중에 역할은 얼마든지 바꿀 수 있습니다.</p>
          <div class="mt-12 grid gap-10 md:grid-cols-[12rem_minmax(0,1fr)] md:grid-rows-[auto_1fr] md:gap-x-10 md:gap-y-8">
            <nav class="md:col-start-1 md:row-start-1" aria-label="글 유형">
              <h2 class="text-xs font-medium text-muted">글 유형</h2>
              <div class="mt-3 flex gap-1 overflow-x-auto max-md:[scrollbar-width:none] md:flex-col">${types}</div>
            </nav>
            <div class="min-w-0 md:col-start-2 md:row-span-2 md:row-start-1">
              <h2 class="text-xs font-medium text-muted">추천 구조 · ${typeName(type)}</h2>
              <div class="mt-4 grid gap-4 md:grid-cols-3">${cards}</div>
              <h2 class="mt-14 text-xs font-medium text-muted">다른 구조 · ${others.length}개</h2>
              <div class="mt-3 flex flex-col gap-0.5">${rows}</div>
            </div>
            <aside class="md:sticky md:top-8 md:col-start-1 md:row-start-2 md:self-start" aria-label="선택한 구조">
              <h2 class="text-xs font-medium text-muted">선택한 구조</h2>
              <div class="mt-3 rounded-lg bg-desk p-4">
                <p class="m-0 text-xs text-muted">${typeName(type)}</p>
                <p class="m-0 mt-1 text-lg font-semibold tracking-tight text-ink">${STRUCTURES[structure].name}</p>
                <div class="mt-3">${stageChips(structure, 'bg-sheet text-ink ring-1 ring-line')}</div>
                <button type="button" data-start class="${primary} mt-5 w-full">이 구조로 작성 시작</button>
              </div>
            </aside>
          </div>
        </section>`;
    }

    function startWriting() {
      const { type, structure } = state.pick;
      const roles = STRUCTURES[structure].roles;
      const now = new Date().toISOString();
      const doc = makeDoc(type, structure, '', roles.length ? roles.map((role) => [role, '']) : [[null, '']], now, now);
      state.docs.unshift(doc);
      state.prefs.deskType = type;
      state.lastDocId = doc.id;
      ui.pickTouched = false;
      persist();
      location.hash = `/doc/${doc.id}`;
    }

    /* ---------- 작업대 ---------- */

    const toolTone = {
      on: `shrink-0 rounded-md bg-folder px-3 py-1 text-sm text-on-folder ring-1 ring-folder motion-safe:transition active:scale-[0.98] ${focusRing}`,
      off: `shrink-0 rounded-md px-3 py-1 text-sm text-ink ring-1 ring-line-strong motion-safe:transition hover:bg-desk active:scale-[0.98] ${focusRing}`,
    };

    function work(doc) {
      const open = state.prefs.panelOpen;
      return `<section class="flex min-h-[70dvh] flex-1 flex-col bg-sheet text-ink md:min-h-0 md:overflow-hidden" aria-label="작업대">
        <div id="work-row" class="flex min-h-0 flex-1 flex-col md:flex-row">
          <div class="relative flex min-w-0 flex-1 flex-col">
            <div id="source-pane" data-wide="false" class="relative min-h-[46dvh] min-w-0 flex-1 overflow-y-auto md:min-h-0">
              <div class="work-grid px-2 pt-10 md:px-8">
                <nav id="outline" class="sticky top-4 max-h-[calc(100dvh-2rem)] overflow-y-auto pb-8 pt-6 [scrollbar-width:thin]" aria-label="문단"></nav>
                  <div class="work-title min-w-0 pl-[5.5rem] pr-3">
                    <p class="m-0 text-xs font-medium text-muted">${typeName(doc.writingType)} · ${STRUCTURES[doc.structure].name}</p>
                    <label class="sr-only" for="doc-title">제목</label>
                    <textarea id="doc-title" rows="1" maxlength="100" placeholder="제목 없음" class="mt-3 block w-full resize-none overflow-hidden break-keep bg-transparent text-3xl font-semibold leading-tight tracking-tight text-ink outline-none placeholder:text-muted/40 md:text-4xl" spellcheck="false">${escapeHtml(doc.title)}</textarea>
                    <div class="mt-5 flex flex-wrap items-center gap-x-4 gap-y-3 border-b border-line pb-5">
                      <p id="save-state" class="m-0 font-mono text-xs text-muted" aria-live="polite"></p>
                      <p data-count class="m-0 font-mono text-xs text-muted"></p>
                      <p id="keep-note" class="m-0 text-xs text-muted" aria-live="polite"></p>
                      <div class="ml-auto flex shrink-0 items-center gap-2">
                        <button type="button" data-keep class="${toolTone.off}">버전 저장</button>
                        <button type="button" id="panel-toggle" data-toggle-panel class="${open ? toolTone.on : toolTone.off}" aria-pressed="${open ? 'true' : 'false'}" aria-controls="panel">AI 피드백</button>
                      </div>
                    </div>
                  </div>
                  <div id="paras" class="flex min-w-0 flex-col gap-1 pb-24 pt-6"></div>
              </div>
            </div>
            <div id="outline-compact" class="z-20 max-md:fixed max-md:bottom-4 max-md:left-4 md:absolute md:bottom-4 md:left-4"></div>
          </div>
          <div id="seam" class="group ${open ? 'md:flex' : ''} hidden w-2 shrink-0 cursor-col-resize items-stretch justify-center bg-sheet ${focusRing}" role="separator" aria-orientation="vertical" aria-label="피드백 너비" tabindex="0">
            <span class="w-px bg-line group-hover:bg-folder-tab group-focus-visible:bg-folder-tab" aria-hidden="true"></span>
          </div>
          <aside id="panel" class="${open ? 'flex' : 'hidden'} relative min-h-[60dvh] shrink-0 flex-col bg-sheet text-ink md:min-h-0" aria-label="AI 피드백"></aside>
        </div>
      </section>`;
    }

    function roleOptions(role) {
      return `<option value="" ${role ? '' : 'selected'}>역할 없음</option>` +
        Object.keys(ROLES).map((key) => `<option value="${key}" ${key === role ? 'selected' : ''}>${ROLES[key]}</option>`).join('');
    }

    function issuesByPara(doc) {
      const latest = analysesOf(doc.id)[0];
      const map = {};
      if (!latest) return map;
      latest.result.issues.forEach((issue, index) => {
        if (issue.paragraphId) (map[issue.paragraphId] = map[issue.paragraphId] || []).push(index + 1);
      });
      return map;
    }

    // 연속해서 같은 역할을 가진 문단을 한 묶음으로 본다. 저장은 문단 단위 그대로다.
    function roleGroups(doc) {
      const groups = [];
      doc.paragraphs.forEach((p, index) => {
        const last = groups[groups.length - 1];
        if (last && last.role === p.role) last.paras.push(p);
        else groups.push({ role: p.role, start: index, paras: [p] });
      });
      return groups;
    }

    function renderParas(doc, focus) {
      const box = document.getElementById('paras');
      if (!box) return;
      const marks = issuesByPara(doc);
      // 같은 역할 묶음은 한 덩어리로 감싸고, 역할 칸과 본문 사이에 묶음 전체를 잇는 막대 하나를 세운다.
      // 이어지는 문단의 역할 칸은 평소 비워 두고, 그 칸에 마우스를 올리거나 역할 상자에 초점이 오면 드러난다.
      box.innerHTML = roleGroups(doc).map((group, g) => {
        const size = group.paras.length;
        const rule = size > 1 ? '<span class="group-rule pointer-events-none absolute bottom-3.5 left-[5.125rem] top-3.5 z-10 w-0.5 rounded-full bg-line-strong" aria-hidden="true"></span>' : '';
        const rows = group.paras.map((p, k) => {
          const index = group.start + k;
          const head = k === 0;
          const nums = marks[p.id];
          const hint = !head ? '이어서 적어 보세요.' : p.role ? ROLE_PROMPTS[p.role] : '문단을 적어 보세요.';
          const label = head
            ? `${index + 1}문단 역할${size > 1 ? `, 아래 ${size - 1}문단까지 함께 바뀜` : ''}`
            : `${index + 1}문단 역할, 앞 문단과 같은 묶음`;
          const place = head ? 'relative w-full' : 'role-cont absolute left-3 right-0 top-1';
          return `<div data-para="${p.id}" data-head="${head}" class="para grid grid-cols-[4.75rem_minmax(0,1fr)] gap-3 rounded-md pb-2 pr-3 ${head ? 'pt-2' : ''}">
            <div class="${head ? '' : 'role-cell '}relative flex flex-col items-start gap-1.5 pl-3 pt-1">
              <label class="sr-only" for="role-${p.id}">${label}</label>
              <select id="role-${p.id}" data-role="${p.id}" class="${place} z-10 cursor-pointer appearance-none rounded border border-line bg-sheet px-1.5 py-0.5 text-xs ${p.role ? 'text-ink' : 'text-muted'} hover:border-line-strong ${focusRing}">${roleOptions(p.role)}</select>
              ${nums ? `<span class="${head ? '' : 'mt-0.5 '}font-mono text-[11px] text-folder-tab">지적 ${nums.join('·')}</span>` : ''}
            </div>
            <label class="sr-only" for="text-${p.id}">${index + 1}문단</label>
            <textarea id="text-${p.id}" data-text="${p.id}" rows="1" placeholder="${escapeHtml(hint)}" class="block w-full resize-none overflow-hidden whitespace-pre-wrap break-words bg-transparent font-mono text-[15px] leading-7 text-ink caret-ink outline-none placeholder:text-muted/40 selection:bg-folder/35 selection:text-ink" spellcheck="false">${escapeHtml(p.text)}</textarea>
          </div>`;
        }).join('');
        return `<div data-group class="relative flex flex-col gap-1 ${g ? 'mt-4' : ''}">${rule}${rows}</div>`;
      }).join('') + (() => {
        const next = nextStageRole(doc);
        return `<button type="button" data-add-para class="ml-[5.75rem] mt-2 self-start rounded-md px-2 py-1 text-sm text-muted motion-safe:transition-colors hover:bg-desk hover:text-ink ${focusRing}">+ 문단${next ? `<span class="text-xs"> · ${ROLES[next]}</span>` : ''}</button>`;
      })();
      box.querySelectorAll('[data-text]').forEach(autosize);
      applyFocusMode(doc);
      if (focus) {
        const target = document.getElementById(`text-${focus.id}`);
        if (target) {
          target.focus();
          const pos = focus.pos === 'end' ? target.value.length : focus.pos;
          target.setSelectionRange(pos, pos);
        }
      }
    }

    function autosize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    // 문단 목록은 본문 왼쪽에 테두리 없이 놓여 스크롤을 따라온다.
    // 본문 폭이 좁으면(휴대폰, 피드백 창을 연 좁은 화면) 왼쪽 아래 버튼으로 여는 목록을 대신 쓴다.
    function outlineList(doc) {
      const marks = issuesByPara(doc);
      const present = new Set(doc.paragraphs.filter((p) => p.text.trim()).map((p) => p.role));
      const stages = STRUCTURES[doc.structure].roles;
      const chips = stages.length
        ? `<p class="m-0 px-3 text-xs font-medium text-muted">구조 단계</p>
          <ol class="m-0 mt-2 flex list-none flex-wrap gap-1 px-3 pb-0 pt-0" aria-label="구조 단계">${stages.map((role) => {
            const done = present.has(role);
            return `<li class="rounded px-1.5 py-0.5 text-xs ${done ? 'bg-folder/25 text-on-folder' : 'text-muted ring-1 ring-line'}">${ROLES[role]}<span class="sr-only">${done ? ', 채움' : ', 비어 있음'}</span></li>`;
          }).join('')}</ol>`
        : '';
      const pad = (n) => String(n).padStart(2, '0');
      const groups = roleGroups(doc);
      const items = groups.map((group) => {
        const ids = group.paras.map((p) => p.id);
        const on = ids.includes(ui.activePara);
        const size = group.paras.length;
        const first = group.paras.find((p) => p.text.trim());
        const text = first ? first.text.trim() : '';
        const range = size > 1 ? `${pad(group.start + 1)}–${pad(group.start + size)}` : pad(group.start + 1);
        return `<button type="button" data-jump="${group.paras[0].id}" class="relative block w-full rounded-md py-1.5 pl-3 pr-2 text-left motion-safe:transition-colors hover:bg-desk ${focusRing}" aria-current="${on ? 'true' : 'false'}">
          ${on ? '<span class="absolute inset-y-2 left-0 w-0.5 rounded-full bg-folder-tab" aria-hidden="true"></span>' : ''}
          <span class="flex items-center gap-2">
            <span class="font-mono text-xs text-muted">${range}</span>
            <span class="text-sm ${on ? 'font-semibold text-ink' : group.role ? 'text-ink' : 'text-muted'}">${group.role ? ROLES[group.role] : '역할 없음'}</span>
            ${size > 1 ? `<span class="text-xs text-muted">${size}문단</span>` : ''}
            ${ids.some((id) => marks[id]) ? '<span class="ml-auto h-1.5 w-1.5 shrink-0 rounded-full bg-folder-tab" aria-hidden="true"></span><span class="sr-only">, 지적 있음</span>' : ''}
          </span>
          <span class="mt-0.5 block truncate text-xs text-muted">${escapeHtml(text ? text.slice(0, 40) : '비어 있음')}</span>
        </button>`;
      }).join('');
      return `${chips}<p class="m-0 ${chips ? 'mt-6' : ''} px-3 pb-1 text-xs font-medium text-muted">역할 흐름 · ${groups.length}개, ${doc.paragraphs.length}문단</p>${items}`;
    }

    function renderOutline(doc) {
      const wide = document.getElementById('outline');
      const compact = document.getElementById('outline-compact');
      if (!wide || !compact) return;
      const list = outlineList(doc);
      const open = ui.outlineOpen;
      const compactHtml = `<button type="button" data-outline-toggle aria-expanded="${open ? 'true' : 'false'}" aria-controls="outline-card" class="flex items-center gap-2 rounded-full bg-sheet px-4 py-2 text-sm text-ink shadow-[0_8px_24px_rgb(26_33_43/0.16)] ring-1 ring-line ${focusRing}">문단 <span class="font-mono text-xs text-muted">${doc.paragraphs.length}</span></button>
        <div id="outline-card" class="${open ? 'block' : 'hidden'} absolute bottom-12 left-0 max-h-[60dvh] w-64 overflow-y-auto rounded-lg bg-sheet py-3 pr-2 shadow-[0_14px_36px_rgb(26_33_43/0.14)] ring-1 ring-line">${list}</div>`;
      if (wide.dataset.drawn !== list) {
        const scroll = wide.scrollTop;
        wide.innerHTML = list;
        wide.dataset.drawn = list;
        wide.scrollTop = scroll;
      }
      if (compact.dataset.drawn !== compactHtml) {
        const card = document.getElementById('outline-card');
        const scroll = card ? card.scrollTop : 0;
        compact.innerHTML = compactHtml;
        compact.dataset.drawn = compactHtml;
        document.getElementById('outline-card').scrollTop = scroll;
      }
    }

    function linkedIssue(doc) {
      const latest = analysesOf(doc.id)[0];
      if (!state.prefs.panelOpen || !latest || ui.tab !== 'issues') return null;
      const issue = latest.result.issues[ui.openIssue];
      if (!issue || !issue.paragraphId || !doc.paragraphs.some((p) => p.id === issue.paragraphId)) return null;
      return issue;
    }

    function applyFocusMode(doc) {
      const issue = linkedIssue(doc);
      document.querySelectorAll('#paras [data-para]').forEach((node) => {
        const id = node.dataset.para;
        const target = issue && issue.paragraphId === id;
        node.dataset.on = target || (!issue && id === ui.activePara) ? 'true' : 'false';
        node.dataset.dim = issue && !target ? 'true' : 'false';
      });
    }

    function isStale(doc, analysis) {
      return JSON.stringify(buildAnalyzeRequest(doc).paragraphs) !== JSON.stringify(analysis.snapshot);
    }

    function renderPanel(doc) {
      const panel = document.getElementById('panel');
      if (!panel || !state.prefs.panelOpen) return;
      const old = document.getElementById('panel-scroll');
      const scroll = old ? old.scrollTop : 0;
      const list = analysesOf(doc.id);
      const analysis = list[0];
      const busy = ui.analyzing;
      const head = `<header class="flex h-12 shrink-0 items-center justify-between gap-3 border-b border-line px-5">
          <h2 class="m-0 text-sm font-semibold text-ink">AI 피드백</h2>
          <div class="flex items-center gap-1">
            <button type="button" data-analyze class="${primary} py-1" ${busy ? 'disabled' : ''}>${busy ? '분석 중…' : analysis ? '다시 분석' : '분석하기'}</button>
            <button type="button" data-close-panel aria-label="피드백 닫기" class="rounded-md p-1.5 text-muted motion-safe:transition-colors hover:bg-desk hover:text-ink ${focusRing}"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
        </header>`;
      const error = ui.analyzeError
        ? `<div class="mx-5 mt-4 rounded-md bg-cream px-3 py-2 text-sm leading-6 text-ink" role="alert">${escapeHtml(ui.analyzeError)} <button type="button" data-analyze class="ml-1 font-medium underline underline-offset-4 ${focusRing}">다시 시도</button></div>`
        : '';
      let body = '';
      if (!analysis) {
        body = `<div class="px-5 py-8">
          <p class="m-0 text-base font-semibold text-ink">아직 분석하지 않았습니다</p>
          <p class="mt-2 break-keep text-sm leading-6 text-muted">문단을 몇 개 적고 분석하기를 누르면 여섯 가지 항목의 점수와 지적 사항이 나옵니다. 소개는 문장을 대신 고치지 않고, 고칠 곳과 질문을 남깁니다.</p>
        </div>`;
      } else {
        const { result } = analysis;
        const stale = isStale(doc, analysis);
        const tabs = [['issues', '지적 사항', result.issues.length], ['compare', '구조 비교', null]];
        body = `<div class="px-5 pt-5">
            <p class="m-0 font-mono text-xs text-muted">${formatWhen(analysis.createdAt)} · ${list.length}번째 분석 · ${analysis.model}</p>
            <p class="m-0 mt-3 flex items-baseline gap-2"><span class="text-[3.75rem] font-semibold leading-none tracking-tight tabular-nums">${average(result.scores).toFixed(1)}</span><span class="font-mono text-sm text-muted">/ 10</span></p>
            ${stale ? '<p class="mt-3 break-keep text-xs leading-5 text-folder-tab">분석한 뒤 글이 바뀌었습니다. 아래 내용은 이전 버전 기준입니다.</p>' : ''}
            <p class="mt-4 break-keep text-sm leading-7 text-ink">${escapeHtml(result.summary)}</p>
            <div class="mt-5">${scoreBars(result.scores, true)}</div>
          </div>
          <div class="sticky top-0 z-10 mt-6 flex gap-1 border-b border-line bg-sheet/90 px-4 py-2 backdrop-blur" role="tablist" aria-label="피드백 보기">
            ${tabs.map(([id, label, count]) => {
              const on = ui.tab === id;
              return `<button type="button" role="tab" data-tab="${id}" aria-selected="${on ? 'true' : 'false'}" class="rounded-md px-2.5 py-1 text-sm motion-safe:transition-colors ${on ? 'bg-hover font-medium text-ink' : 'text-muted hover:bg-hover/60'} ${focusRing}">${label}${count === null ? '' : ` <span class="font-mono text-xs">${count}</span>`}</button>`;
            }).join('')}
          </div>
          ${ui.tab === 'issues' ? issuesHtml(doc, analysis) : compareHtml(doc, analysis)}`;
      }
      panel.innerHTML = `${head}
        <div id="panel-scroll" class="min-h-0 flex-1 overflow-y-auto">${error}${body}<div class="h-12" aria-hidden="true"></div></div>
        <div class="pointer-events-none absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-sheet to-transparent" aria-hidden="true"></div>`;
      document.getElementById('panel-scroll').scrollTop = scroll;
      document.querySelectorAll('[data-analyze]').forEach((button) => {
        button.disabled = busy;
      });
    }

    function issuesHtml(doc, analysis) {
      const { issues } = analysis.result;
      if (!issues.length) return '<p class="px-5 py-6 text-sm leading-6 text-muted">이번 분석에서는 지적할 곳을 찾지 못했습니다.</p>';
      return `<ol class="m-0 list-none p-0">${issues.map((issue, index) => {
        const hint = (analysis.hints && analysis.hints[index]) || { label: '', role: null };
        const open = index === ui.openIssue;
        const current = issue.paragraphId ? doc.paragraphs.findIndex((p) => p.id === issue.paragraphId) : -1;
        const unlinked = issue.paragraphId && current === -1;
        const where = !issue.paragraphId ? '글 전체' : unlinked ? `분석 때 ${issue.paragraphIndexAtAnalysis + 1}문단` : `${current + 1}문단`;
        const canApply = hint.role ? true : !unlinked && issue.paragraphId;
        const detail = open ? `<div class="flex flex-col gap-4 pb-5 pl-11 pr-5">
            ${unlinked ? '<p class="m-0 text-xs text-folder-tab">현재 문단과 연결되지 않음 · 분석할 때의 문장입니다.</p>' : ''}
            <blockquote class="m-0 break-keep border-l-2 border-ink pl-3 text-sm leading-7 text-ink">${escapeHtml(issue.excerpt)}</blockquote>
            <div><p class="m-0 text-xs font-semibold text-ink">생각해 볼 질문</p><p class="m-0 mt-1 break-keep text-sm leading-6 text-ink">${escapeHtml(issue.question)}</p></div>
            <div><p class="m-0 text-xs font-semibold text-ink">개선 방향</p><p class="m-0 mt-1 break-keep text-sm leading-6 text-ink">${escapeHtml(issue.suggestion)}</p></div>
            <div><p class="m-0 text-xs font-semibold text-ink">예시 <span class="font-normal text-muted">· 칸은 직접 채워 주세요</span></p><p class="m-0 mt-1.5 break-keep rounded-md bg-sheet px-3 py-2 text-sm leading-7 text-ink ring-1 ring-line">${blanks(issue.revisedExample)}</p></div>
            ${canApply ? `<div><button type="button" data-apply="${index}" class="rounded-md border border-folder-tab px-3 py-1 text-sm text-ink motion-safe:transition hover:bg-folder/15 active:scale-[0.98] ${focusRing}">${!hint.role ? '예시로 바꾸기' : doc.paragraphs.some((p) => p.role === hint.role && !p.text.trim()) ? `빈 '${ROLES[hint.role]}' 문단에 넣기` : `'${ROLES[hint.role]}' 문단 추가`}</button></div>` : ''}
          </div>` : '';
        return `<li class="border-l-2 motion-safe:transition-colors ${open ? 'border-folder-tab bg-cream/70' : 'border-transparent'}">
          <button type="button" data-issue="${index}" aria-expanded="${open ? 'true' : 'false'}" class="flex w-full gap-3 px-5 py-3 text-left ${open ? '' : 'hover:bg-hover/50'} ${focusRing}">
            <span class="mt-0.5 w-3 shrink-0 font-mono text-xs text-folder-tab">${index + 1}</span>
            <span class="min-w-0"><span class="block text-xs text-muted">${where}${hint.label ? ` · ${hint.label}` : ''}</span><span class="mt-1 block break-keep text-sm leading-6 text-ink">${escapeHtml(issue.reason)}</span></span>
          </button>
          ${detail}
        </li>`;
      }).join('')}</ol>`;
    }

    function compareHtml(doc, analysis) {
      const cmp = analysis.result.structureComparison;
      const label = { match: '일치', partial: '부분 일치', mismatch: '불일치' }[cmp.alignment];
      const tone = cmp.alignment === 'match' ? 'bg-ink text-sheet' : cmp.alignment === 'partial' ? 'bg-folder/30 text-on-folder' : 'bg-alert text-sheet';
      const stages = STRUCTURES[cmp.selectedStructure].roles;
      const roles = analysis.snapshot.map((p) => p.role);
      const chip = (text, extra) => `<span class="rounded px-1.5 py-0.5 text-xs ${extra}">${text}</span>`;
      return `<div class="px-5 py-5">
        <p class="m-0">${chip(label, tone)}</p>
        <dl class="mt-4 grid grid-cols-[5.5rem_minmax(0,1fr)] gap-x-3 gap-y-2 text-sm">
          <dt class="text-muted">선택한 구조</dt><dd class="m-0 font-medium text-ink">${STRUCTURES[cmp.selectedStructure].name}</dd>
          <dt class="text-muted">읽힌 구조</dt><dd class="m-0 font-medium text-ink">${STRUCTURES[cmp.detectedStructure].name}</dd>
        </dl>
        <p class="mt-4 break-keep text-sm leading-7 text-ink">${escapeHtml(cmp.explanation)}</p>
        <h3 class="mt-6 text-xs font-medium text-muted">선택한 구조의 단계</h3>
        <div class="mt-2 flex flex-wrap gap-1">${stages.length ? stages.map((role) => chip(ROLES[role], roles.includes(role) ? 'bg-desk text-ink ring-1 ring-line' : 'border border-dashed border-folder-tab text-folder-tab')).join('') : '<span class="text-xs text-muted">정해진 단계 없음</span>'}</div>
        <h3 class="mt-5 text-xs font-medium text-muted">분석한 글의 문단 순서</h3>
        <ol class="m-0 mt-2 flex list-none flex-wrap gap-1 p-0">${roles.map((role, index) => `<li>${chip(`<span class="font-mono">${index + 1}</span> ${role ? ROLES[role] : '역할 없음'}`, role ? 'bg-desk text-ink ring-1 ring-line' : 'text-muted ring-1 ring-line')}</li>`).join('')}</ol>
        ${stages.length ? '<p class="mt-3 text-xs leading-5 text-muted">점선은 아직 어떤 문단도 맡지 않은 단계입니다.</p>' : ''}
      </div>`;
    }

    function refreshCounts(doc) {
      const text = docText(doc);
      const filled = doc.paragraphs.filter((p) => p.text.trim()).length;
      app.querySelectorAll('[data-count]').forEach((node) => { node.textContent = `${countChars(text)}자, ${filled}문단`; });
    }

    function paintSave() {
      const node = document.getElementById('save-state');
      if (!node) return;
      if (ui.saveStatus === 'saving') node.innerHTML = '저장 중…';
      else if (ui.saveStatus === 'failed') node.innerHTML = `<button type="button" data-retry-save class="text-alert underline underline-offset-4 ${focusRing}">저장 안 됨 · 다시 시도</button>`;
      else node.textContent = ui.savedAt ? `저장됨 · ${ui.savedAt}` : '저장됨';
    }

    function scheduleSave(doc) {
      ui.saveStatus = 'saving';
      paintSave();
      clearTimeout(ui.saveTimer);
      ui.saveTimer = setTimeout(() => flushSave(doc), 800);
    }

    function flushSave(doc) {
      clearTimeout(ui.saveTimer);
      ui.saveTimer = 0;
      if (doc) doc.updatedAt = new Date().toISOString();
      const ok = persist();
      ui.saveStatus = ok ? 'saved' : 'failed';
      if (ok) ui.savedAt = clock(new Date());
      paintSave();
      if (doc && ui.docId === doc.id) renderPanel(doc);
    }

    function note(text) {
      const node = document.getElementById('keep-note');
      if (!node) return;
      node.textContent = text;
      clearTimeout(note.timer);
      note.timer = setTimeout(() => { node.textContent = ''; }, 4000);
    }

    function currentDoc() { return docById(ui.docId); }

    // '+ 문단'으로 끝에 붙이는 문단은 마지막으로 쓴 구조 단계의 다음 단계를 맡는다.
    // 마지막 단계였으면 그 단계를 이어 쓰고, 아직 구조 단계를 하나도 쓰지 않았으면 첫 단계부터 시작한다.
    // 자유 구조처럼 단계가 없으면 마지막 문단의 역할을 그대로 잇는다.
    function nextStageRole(doc) {
      const stages = STRUCTURES[doc.structure].roles;
      const last = doc.paragraphs[doc.paragraphs.length - 1];
      if (!stages.length) return last ? last.role : null;
      const written = [...doc.paragraphs].reverse().find((p) => stages.includes(p.role));
      if (!written) return stages[0];
      const at = stages.indexOf(written.role);
      return stages[Math.min(at + 1, stages.length - 1)];
    }

    function splitPara(textarea) {
      const doc = currentDoc();
      const index = doc.paragraphs.findIndex((p) => p.id === textarea.dataset.text);
      const para = doc.paragraphs[index];
      const pos = textarea.selectionStart;
      const tail = para.text.slice(textarea.selectionEnd);
      para.text = para.text.slice(0, pos);
      const next = { id: uid(), role: para.role, text: tail };
      doc.paragraphs.splice(index + 1, 0, next);
      ui.activePara = next.id;
      afterStructureChange(doc, { id: next.id, pos: 0 });
    }

    function mergeUp(textarea) {
      const doc = currentDoc();
      const index = doc.paragraphs.findIndex((p) => p.id === textarea.dataset.text);
      if (index <= 0) return false;
      const prev = doc.paragraphs[index - 1];
      const pos = prev.text.length;
      prev.text += doc.paragraphs[index].text;
      doc.paragraphs.splice(index, 1);
      ui.activePara = prev.id;
      afterStructureChange(doc, { id: prev.id, pos });
      return true;
    }

    function mergeDown(textarea) {
      const doc = currentDoc();
      const index = doc.paragraphs.findIndex((p) => p.id === textarea.dataset.text);
      if (index === -1 || index >= doc.paragraphs.length - 1) return false;
      const para = doc.paragraphs[index];
      const pos = para.text.length;
      para.text += doc.paragraphs[index + 1].text;
      doc.paragraphs.splice(index + 1, 1);
      afterStructureChange(doc, { id: para.id, pos });
      return true;
    }

    function afterStructureChange(doc, focus) {
      renderParas(doc, focus);
      renderOutline(doc);
      renderPanel(doc);
      refreshCounts(doc);
      scheduleSave(doc);
    }

    function pasteParas(textarea, text) {
      const parts = text.replace(/\r\n/g, '\n').split(/\n+/).map((item) => item.trim()).filter(Boolean);
      if (parts.length < 2) return false;
      const doc = currentDoc();
      const index = doc.paragraphs.findIndex((p) => p.id === textarea.dataset.text);
      const para = doc.paragraphs[index];
      const head = para.text.slice(0, textarea.selectionStart);
      const tail = para.text.slice(textarea.selectionEnd);
      para.text = head + parts[0];
      const added = parts.slice(1).map((part) => ({ id: uid(), role: para.role, text: part }));
      const last = added[added.length - 1];
      const pos = last.text.length;
      last.text += tail;
      doc.paragraphs.splice(index + 1, 0, ...added);
      ui.activePara = last.id;
      afterStructureChange(doc, { id: last.id, pos });
      return true;
    }

    function runAnalysis() {
      const doc = currentDoc();
      if (!doc || ui.analyzing) return;
      if (!state.prefs.panelOpen) togglePanel(true);
      const request = buildAnalyzeRequest(doc);
      ui.analyzeError = '';
      if (!request.paragraphs.length) {
        ui.analyzeError = '분석할 문단이 없습니다. 한 문단 이상 적은 뒤 다시 시도해 주세요.';
        renderPanel(doc);
        return;
      }
      ui.analyzing = true;
      renderPanel(doc);
      if (ui.saveTimer) flushSave(doc);
      setTimeout(() => {
        const record = analyze(request);
        const list = state.analyses[doc.id] || (state.analyses[doc.id] = []);
        list.unshift({
          id: uid(), documentId: doc.id, versionId: null, snapshot: request.paragraphs, schemaVersion: SCHEMA_VERSION,
          model: 'mock', promptVersion: null, result: record.result, hints: record.hints, createdAt: new Date().toISOString(),
        });
        ui.analyzing = false;
        ui.tab = 'issues';
        ui.openIssue = record.result.issues.length ? 0 : -1;
        persist();
        const scroller = document.getElementById('panel-scroll');
        if (scroller) scroller.scrollTop = 0;
        renderParas(doc);
        renderOutline(doc);
        renderPanel(doc);
        revealIssue(doc);
      }, 700);
    }

    function revealIssue(doc) {
      const issue = linkedIssue(doc);
      if (!issue) return;
      const node = document.querySelector(`[data-para="${issue.paragraphId}"]`);
      const pane = document.getElementById('source-pane');
      if (!node || !pane) return;
      const top = node.offsetTop - pane.offsetTop;
      if (top < pane.scrollTop + 24 || top + node.offsetHeight > pane.scrollTop + pane.clientHeight - 24) {
        pane.scrollTo({ top: Math.max(0, top - pane.clientHeight / 3), behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }
    }

    function applySuggestion(index) {
      const doc = currentDoc();
      const analysis = analysesOf(doc.id)[0];
      const issue = analysis && analysis.result.issues[index];
      if (!issue) return;
      const hint = (analysis.hints && analysis.hints[index]) || {};
      if (hint.role) {
        createVersion(doc, 'before_apply_suggestion');
        const blank = doc.paragraphs.find((p) => p.role === hint.role && !p.text.trim());
        if (blank) {
          blank.text = issue.revisedExample;
          ui.activePara = blank.id;
          ui.openIssue = -1;
          afterStructureChange(doc, { id: blank.id, pos: 'end' });
          note(`비어 있던 '${ROLES[hint.role]}' 문단에 예시를 넣었습니다. 칸을 채워 주세요.`);
          return;
        }
        const stages = STRUCTURES[doc.structure].roles;
        const want = stages.indexOf(hint.role);
        let at = doc.paragraphs.length;
        for (let i = 0; i < doc.paragraphs.length; i += 1) {
          if (stages.indexOf(doc.paragraphs[i].role) > want) { at = i; break; }
        }
        const para = { id: uid(), role: hint.role, text: issue.revisedExample };
        doc.paragraphs.splice(at, 0, para);
        ui.activePara = para.id;
        ui.openIssue = -1;
        afterStructureChange(doc, { id: para.id, pos: 'end' });
        note(`'${ROLES[hint.role]}' 문단을 넣었습니다. 칸을 채워 주세요.`);
        return;
      }
      const para = doc.paragraphs.find((p) => p.id === issue.paragraphId);
      if (!para || !para.text.includes(issue.excerpt)) {
        note('지금 글에서 그 문장을 찾지 못했습니다. 예시를 보며 직접 고쳐 주세요.');
        return;
      }
      createVersion(doc, 'before_apply_suggestion');
      para.text = para.text.replace(issue.excerpt, issue.revisedExample);
      ui.activePara = para.id;
      afterStructureChange(doc, { id: para.id, pos: para.text.indexOf(issue.revisedExample) + issue.revisedExample.length });
      note('예시로 바꿨습니다. 바꾸기 전 글은 버전에 남았습니다.');
    }

    function togglePanel(force) {
      const doc = currentDoc();
      state.prefs.panelOpen = typeof force === 'boolean' ? force : !state.prefs.panelOpen;
      persist();
      const open = state.prefs.panelOpen;
      const panel = document.getElementById('panel');
      const seam = document.getElementById('seam');
      const button = document.getElementById('panel-toggle');
      panel.classList.toggle('hidden', !open);
      panel.classList.toggle('flex', open);
      seam.classList.toggle('md:flex', open);
      button.className = open ? toolTone.on : toolTone.off;
      button.setAttribute('aria-pressed', open ? 'true' : 'false');
      applySplit();
      renderPanel(doc);
      applyFocusMode(doc);
    }

    function applySplit() {
      const panel = document.getElementById('panel');
      if (!panel) return;
      panel.style.width = window.matchMedia('(min-width: 768px)').matches ? ui.panelW : '';
    }

    let paneWatch = null;

    function bindWork() {
      applySplit();
      // Tailwind CDN이 스타일을 늦게 붙이거나 폭이 바뀌면 문단 높이를 다시 잰다.
      if (paneWatch) paneWatch.disconnect();
      const pane = document.getElementById('source-pane');
      const measure = () => {
        const wide = pane.clientWidth >= 800;
        if (pane.dataset.wide !== String(wide)) {
          pane.dataset.wide = String(wide);
          if (wide) ui.outlineOpen = false;
        }
      };
      measure();
      paneWatch = new ResizeObserver(() => {
        measure();
        document.querySelectorAll('#paras [data-text], #doc-title').forEach(autosize);
      });
      paneWatch.observe(pane);
      paneWatch.observe(document.getElementById('paras'));
      const seam = document.getElementById('seam');
      seam.addEventListener('pointerdown', (event) => {
        if (!window.matchMedia('(min-width: 768px)').matches) return;
        event.preventDefault();
        seam.setPointerCapture(event.pointerId);
        const row = document.getElementById('work-row');
        const move = (ev) => {
          const rect = row.getBoundingClientRect();
          const max = rect.width - 360;
          ui.panelW = Math.round(Math.min(Math.max(rect.right - ev.clientX, 320), Math.max(320, max))) + 'px';
          applySplit();
          document.querySelectorAll('#paras [data-text]').forEach(autosize);
        };
        const up = () => {
          seam.removeEventListener('pointermove', move);
          seam.removeEventListener('pointerup', up);
        };
        seam.addEventListener('pointermove', move);
        seam.addEventListener('pointerup', up);
      });
      seam.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        const current = document.getElementById('panel').getBoundingClientRect().width;
        ui.panelW = Math.max(320, current + (event.key === 'ArrowLeft' ? 24 : -24)) + 'px';
        applySplit();
        document.querySelectorAll('#paras [data-text]').forEach(autosize);
      });
    }

    function notFound() {
      return `<section class="mx-auto max-w-5xl px-5 py-10 md:px-14 md:py-14" aria-label="문서 없음">
        <p class="text-sm font-medium text-ink">${formatToday()}</p>
        <h1 class="mt-10 text-3xl font-semibold tracking-tight md:text-4xl">문서를 찾을 수 없어요</h1>
        <p class="mt-3 max-w-xl break-keep text-base leading-7 text-muted">지워졌거나 주소가 바뀐 문서입니다. 대시보드에서 다른 글을 열어 주세요.</p>
        <a href="#/desk" class="${primary} mt-6 inline-block no-underline">대시보드로</a>
      </section>`;
    }

    /* ---------- 라우팅 ---------- */

    function route() {
      const hash = location.hash.replace(/^#/, '') || '/desk';
      const [path, qs] = hash.split('?');
      const parts = path.split('/').filter(Boolean);
      return { raw: hash, name: parts[0] || 'desk', id: parts[1] || '', query: new URLSearchParams(qs || '') };
    }

    function leaveDoc() {
      const doc = currentDoc();
      if (doc && ui.saveTimer) flushSave(doc);
      ui.docId = '';
      ui.outlineOpen = false;
      ui.openIssue = -1;
      ui.activePara = '';
      ui.analyzeError = '';
      ui.analyzing = false;
    }

    function mount() {
      const current = route();
      if (!session() && current.name !== 'login') {
        location.replace(`#/login?next=${encodeURIComponent(current.raw)}`);
        return;
      }
      if (session() && current.name === 'login') {
        location.replace('#/desk');
        return;
      }
      if (ui.docId && (current.name !== 'doc' || current.id !== ui.docId)) leaveDoc();
      document.body.className = 'm-0 min-h-[100dvh] bg-night font-sans text-night-text antialiased';
      const paper = 'min-w-0 flex-1 overflow-auto bg-sheet text-ink';

      if (current.name === 'login') {
        app.innerHTML = login();
        document.title = 'SOGAE 로그인';
        return;
      }
      if (current.name === 'new') {
        app.innerHTML = shell('new', structurePage(current.query), paper);
        document.title = 'SOGAE 새 글';
        return;
      }
      if (current.name === 'doc') {
        const doc = docById(current.id);
        if (!doc) {
          app.innerHTML = shell('doc', notFound(), paper);
          document.title = 'SOGAE 문서 없음';
          return;
        }
        const fresh = ui.docId !== doc.id;
        ui.docId = doc.id;
        state.lastDocId = doc.id;
        state.prefs.deskType = doc.writingType;
        persist();
        if (fresh) {
          const issue = current.query.get('issue');
          ui.tab = 'issues';
          ui.openIssue = issue !== null ? Number(issue) : -1;
          if (issue !== null) state.prefs.panelOpen = true;
          ui.saveStatus = 'saved';
          ui.savedAt = clock(new Date(doc.updatedAt));
        }
        app.innerHTML = shell('doc', work(doc), 'flex min-h-0 min-w-0 flex-1 flex-col');
        const empty = doc.paragraphs.find((p) => !p.text);
        renderParas(doc, fresh && empty ? { id: empty.id, pos: 0 } : null);
        renderOutline(doc);
        renderPanel(doc);
        refreshCounts(doc);
        paintSave();
        bindWork();
        autosize(document.getElementById('doc-title'));
        revealIssue(doc);
        document.title = `SOGAE ${docTitle(doc)}`;
        return;
      }
      app.innerHTML = shell('desk', desk(), paper);
      document.title = 'SOGAE 대시보드';
    }

    /* ---------- 이벤트 ---------- */

    app.addEventListener('submit', (event) => {
      if (event.target.id !== 'login-form') return;
      event.preventDefault();
      signIn();
    });

    app.addEventListener('input', (event) => {
      if (event.target.matches('#email, #password')) {
        if (ui.loginTouched) checkLogin(true);
        return;
      }
      const doc = currentDoc();
      if (!doc) return;
      if (event.target.id === 'doc-title') {
        doc.title = event.target.value.replace(/\n/g, ' ').slice(0, 100);
        autosize(event.target);
        document.title = `SOGAE ${docTitle(doc)}`;
        scheduleSave(doc);
        return;
      }
      const textarea = event.target.closest('[data-text]');
      if (!textarea) return;
      const para = doc.paragraphs.find((p) => p.id === textarea.dataset.text);
      para.text = textarea.value;
      autosize(textarea);
      renderOutline(doc);
      refreshCounts(doc);
      scheduleSave(doc);
    });

    app.addEventListener('focusout', (event) => {
      if (event.target.matches('#email, #password') && event.target.value) {
        ui.loginTouched = true;
        checkLogin(true);
      }
    });

    app.addEventListener('change', (event) => {
      const select = event.target.closest('[data-role]');
      if (!select) return;
      const doc = currentDoc();
      const index = doc.paragraphs.findIndex((p) => p.id === select.dataset.role);
      const para = doc.paragraphs[index];
      const before = para.role;
      const role = select.value || null;
      if (select.closest('[data-para]').dataset.head === 'true') {
        for (let i = index; i < doc.paragraphs.length && doc.paragraphs[i].role === before; i += 1) doc.paragraphs[i].role = role;
      } else {
        para.role = role;
      }
      renderParas(doc);
      renderOutline(doc);
      scheduleSave(doc);
      const again = document.getElementById(`role-${para.id}`);
      if (again) again.focus();
    });

    app.addEventListener('focusin', (event) => {
      const target = event.target.closest('[data-text], [data-role]');
      if (!target) return;
      const doc = currentDoc();
      const id = target.dataset.text || target.dataset.role;
      ui.activePara = id;
      const issue = linkedIssue(doc);
      if (issue && issue.paragraphId !== id) {
        ui.openIssue = -1;
        renderPanel(doc);
      }
      applyFocusMode(doc);
      renderOutline(doc);
    });

    app.addEventListener('keydown', (event) => {
      if (event.target.id === 'doc-title' && event.key === 'Enter' && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        const first = document.querySelector('#paras [data-text]');
        if (first) { first.focus(); first.setSelectionRange(0, 0); }
        return;
      }
      const textarea = event.target.closest && event.target.closest('[data-text]');
      if (!textarea || event.isComposing || event.keyCode === 229) return;
      const atStart = textarea.selectionStart === 0 && textarea.selectionEnd === 0;
      const atEnd = textarea.selectionStart === textarea.value.length && textarea.selectionEnd === textarea.value.length;
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        splitPara(textarea);
      } else if (event.key === 'Backspace' && atStart) {
        if (mergeUp(textarea)) event.preventDefault();
      } else if (event.key === 'Delete' && atEnd) {
        if (mergeDown(textarea)) event.preventDefault();
      } else if (event.key === 'ArrowUp' && atStart) {
        // 문단은 역할 묶음마다 감싸여 있으므로 형제 대신 전체 문단 순서로 옮겨 간다.
        const all = [...document.querySelectorAll('#paras [data-text]')];
        const target = all[all.indexOf(textarea) - 1];
        if (target) { event.preventDefault(); target.focus(); target.setSelectionRange(target.value.length, target.value.length); }
      } else if (event.key === 'ArrowDown' && atEnd) {
        const all = [...document.querySelectorAll('#paras [data-text]')];
        const target = all[all.indexOf(textarea) + 1];
        if (target) { event.preventDefault(); target.focus(); target.setSelectionRange(0, 0); }
      }
    });

    app.addEventListener('paste', (event) => {
      const textarea = event.target.closest && event.target.closest('[data-text]');
      if (!textarea) return;
      const text = event.clipboardData.getData('text/plain');
      if (pasteParas(textarea, text)) event.preventDefault();
    });

    app.addEventListener('click', (event) => {
      if (event.target.closest('[data-signout]')) {
        leaveDoc();
        state.session = null;
        persist();
        location.hash = '/login';
        return;
      }
      const deskType = event.target.closest('[data-desk-type]');
      if (deskType) { state.prefs.deskType = deskType.dataset.deskType; persist(); mount(); return; }
      const remover = event.target.closest('[data-remove]');
      if (remover) {
        const doc = docById(remover.dataset.remove);
        if (!doc || !window.confirm(`「${docTitle(doc)}」을 지울까요? 분석과 버전도 함께 사라집니다.`)) return;
        state.docs = state.docs.filter((item) => item.id !== doc.id);
        delete state.analyses[doc.id];
        delete state.versions[doc.id];
        if (state.lastDocId === doc.id) state.lastDocId = sortedDocs()[0] ? sortedDocs()[0].id : '';
        persist();
        mount();
        return;
      }
      const pickType = event.target.closest('[data-pick-type]');
      if (pickType) {
        ui.pickTouched = true;
        state.pick = { type: pickType.dataset.pickType, structure: RECOMMEND[pickType.dataset.pickType][0] };
        persist();
        mount();
        return;
      }
      const pick = event.target.closest('[data-pick]');
      if (pick) {
        ui.pickTouched = true;
        state.pick.structure = pick.dataset.pick;
        persist();
        const scroller = app.querySelector('.overflow-auto');
        const scroll = scroller ? scroller.scrollTop : 0;
        mount();
        const again = app.querySelector('.overflow-auto');
        if (again) again.scrollTop = scroll;
        const button = app.querySelector(`[data-pick="${pick.dataset.pick}"]`);
        if (button) button.focus({ preventScroll: true });
        return;
      }
      if (event.target.closest('[data-start]')) { startWriting(); return; }

      const doc = currentDoc();
      if (!doc) return;
      if (event.target.closest('[data-outline-toggle]')) { ui.outlineOpen = !ui.outlineOpen; renderOutline(doc); return; }
      if (ui.outlineOpen && !event.target.closest('#outline-compact')) { ui.outlineOpen = false; renderOutline(doc); }
      if (event.target.closest('[data-close-panel]')) { togglePanel(false); document.getElementById('panel-toggle').focus(); return; }
      if (event.target.closest('[data-toggle-panel]')) { togglePanel(); return; }
      if (event.target.closest('[data-analyze]')) { runAnalysis(); return; }
      if (event.target.closest('[data-retry-save]')) { flushSave(doc); return; }
      if (event.target.closest('[data-keep]')) {
        if (ui.saveTimer) flushSave(doc);
        const kept = createVersion(doc, 'manual');
        persist();
        const count = (state.versions[doc.id] || []).length;
        note(kept ? `버전 ${count}을 남겼습니다.` : '이미 남겨 둔 버전과 같습니다.');
        return;
      }
      if (event.target.closest('[data-add-para]')) {
        const para = { id: uid(), role: nextStageRole(doc), text: '' };
        doc.paragraphs.push(para);
        ui.activePara = para.id;
        afterStructureChange(doc, { id: para.id, pos: 0 });
        return;
      }
      const jump = event.target.closest('[data-jump]');
      if (jump) {
        ui.outlineOpen = false;
        const textarea = document.getElementById(`text-${jump.dataset.jump}`);
        if (textarea) {
          textarea.focus({ preventScroll: true });
          textarea.closest('[data-para]').scrollIntoView({ block: 'center', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        }
        return;
      }
      const tab = event.target.closest('[data-tab]');
      if (tab) { ui.tab = tab.dataset.tab; renderPanel(doc); applyFocusMode(doc); return; }
      const issue = event.target.closest('[data-issue]');
      if (issue) {
        const index = Number(issue.dataset.issue);
        ui.openIssue = ui.openIssue === index ? -1 : index;
        renderPanel(doc);
        applyFocusMode(doc);
        revealIssue(doc);
        const again = document.querySelector(`[data-issue="${index}"]`);
        if (again) again.focus({ preventScroll: true });
        return;
      }
      const apply = event.target.closest('[data-apply]');
      if (apply) { applySuggestion(Number(apply.dataset.apply)); }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && ui.docId && ui.outlineOpen) {
        ui.outlineOpen = false;
        renderOutline(currentDoc());
        return;
      }
      if (event.key === 'Escape' && ui.docId && ui.openIssue !== -1) {
        ui.openIssue = -1;
        const doc = currentDoc();
        renderPanel(doc);
        applyFocusMode(doc);
      }
    });

    window.addEventListener('hashchange', mount);
    window.addEventListener('resize', () => {
      if (!ui.docId) return;
      applySplit();
      document.querySelectorAll('#paras [data-text]').forEach(autosize);
    });
    window.addEventListener('beforeunload', () => {
      const doc = currentDoc();
      if (doc && ui.saveTimer) flushSave(doc);
    });

    load();
    mount();
  </script>
</body>
</html>
